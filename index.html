<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <div class="margin-rule"></div>

    <header class="ledger-head">
      <p class="kicker">Book I</p>
      <h1>Expense Ledger</h1>
    </header>

    <section class="balance-block">
      <p class="balance-label">Balance</p>
      <p class="balance-figure" id="balanceFigure">₹0.00</p>
      <div class="balance-sub">
        <span class="sub-item income">
          <span class="dot"></span> In &nbsp;<span id="totalIn">₹0.00</span>
        </span>
        <span class="sub-item expense">
          <span class="dot"></span> Out &nbsp;<span id="totalOut">₹0.00</span>
        </span>
      </div>
    </section>

    <hr class="rule">

    <section class="entry-block">
      <p class="section-label">New entry</p>
      <form id="entryForm" class="entry-form">
        <input
          type="text"
          id="descInput"
          placeholder="What was it for?"
          autocomplete="off"
          required
        >
        <input
          type="number"
          id="amountInput"
          placeholder="0.00"
          step="0.01"
          min="0.01"
          required
        >
        <div class="type-toggle" role="radiogroup" aria-label="Entry type">
          <button type="button" class="type-btn active" data-type="expense" aria-pressed="true">Spent</button>
          <button type="button" class="type-btn" data-type="income" aria-pressed="false">Received</button>
        </div>
        <button type="submit" class="add-btn">Add to ledger</button>
      </form>
      <p class="form-error" id="formError" hidden>Enter a description and an amount above zero.</p>
    </section>

    <hr class="rule">

    <section class="history-block">
      <div class="history-head">
        <p class="section-label">Entries</p>
        <button class="clear-btn" id="clearBtn" hidden>Clear all</button>
      </div>

      <div id="emptyState" class="empty-state">
        <p>The ledger is empty.</p>
        <p class="empty-sub">Add your first entry above to start tracking.</p>
      </div>

      <ul id="entryList" class="entry-list"></ul>
    </section>

    <p class="footnote">Entries are kept only for this session — refreshing the page starts a fresh ledger.</p>
  </div>

<script src="script.js"></script>
</body>
</html>
